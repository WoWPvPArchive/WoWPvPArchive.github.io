<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Choose Your Expansion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="home.css">
</head>
<body>

  <!-- Three equal columns by default. Hovering the whole group dims
       and desaturates every column via CSS alone; hovering one
       specific column then overrides it back to full color, widens
       it (flex-grow), and gives it a gold border/brighter logo --
       see home.css. Only the middle (Vanilla) column actually
       navigates anywhere right now. -->
  <div class="expansion-select">

    <button type="button" class="expansion-column" data-expansion="bc" style="background-image: url('images/expansions/burning-crusade.jpg');">
      <img class="expansion-logo" src="images/expansions/logo-bc.png" alt="The Burning Crusade">
    </button>

    <button type="button" class="expansion-column" data-expansion="vanilla" style="background-image: url('images/expansions/vanilla.png');">
      <img class="expansion-logo" src="images/expansions/logo-vanilla.png" alt="World of Warcraft">
    </button>

    <button type="button" class="expansion-column" data-expansion="wrath" style="background-image: url('images/expansions/wrath.png');">
      <img class="expansion-logo" src="images/expansions/logo-wrath.png" alt="Wrath of the Lich King">
    </button>

  </div>

  <script src="home.js"></script>
</body>
</html>
